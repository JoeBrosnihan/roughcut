[workspace]
resolver = "2"
members = ["crates/roughcut-core", "crates/roughcut-mpv", "crates/roughcut-app"]

[workspace.package]
version = "0.17.2"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
# Pinned to the newest egui whose MSRV (1.88) the project's stable toolchain
# satisfies. `glow` is taken from eframe's re-export so the two can never
# disagree about the GL type definitions mpv renders into.
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.33"
egui_glow = "0.33"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.9"
log = "0.4"
num_cpus = "1.17"
quick-xml = "0.41"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
