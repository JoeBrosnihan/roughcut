[package]
name = "roughcut-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Roughcut — a keyboard-driven assembly editor that exports MLT XML"

[[bin]]
name = "roughcut"
path = "src/main.rs"

[dependencies]
roughcut-core = { path = "../roughcut-core" }
roughcut-mpv = { path = "../roughcut-mpv" }

anyhow.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
egui_glow.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
num_cpus.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Thread priority for background workers, working-set sizes for the gauge,
# and the clipboard, which is where a pasted screenshot comes from.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
